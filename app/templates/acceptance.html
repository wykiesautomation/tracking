{% extends 'base.html' %}{% block body %}<h1>Production Acceptance</h1><section class="split"><article class="panel"><h2>Campaigns</h2>{% for c in campaigns %}<div class="event"><div><b><a href="{{url_for('main.acceptance_detail',campaign_id=c.id)}}">{{c.name}}</a></b><small>{{c.environment}} · {{c.created_at}}</small></div><span class="status {{'ok' if c.state=='ACCEPTED' else 'warn'}}">{{c.state}}</span></div>{% else %}<p>No acceptance campaign.</p>{% endfor %}</article><article class="panel"><h2>New Acceptance Campaign</h2><form method="post"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><label>Name<input name="name" value="FleetTrack 360 Production Acceptance" required></label><label>Environment<select name="environment"><option>STAGING</option><option>PILOT</option><option>PRODUCTION_CANDIDATE</option></select></label><label>Target start<input name="target_start" type="datetime-local"></label><label>Target end<input name="target_end" type="datetime-local"></label><button class="button primary">Create Full Checklist</button></form></article></section>{% endblock %}
