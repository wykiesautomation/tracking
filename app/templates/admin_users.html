{% extends 'base.html' %}{% block body %}<h1>User Administration</h1><section class="split"><article class="panel"><h2>Customer Users</h2><table><tr><th>Name</th><th>Email</th><th>Role</th><th>State</th><th>Action</th></tr>{% for u in users %}<tr><td>{{u.name}}</td><td>{{u.email}}</td><td>{{u.role}}</td><td>{{'ACTIVE' if u.active else 'DISABLED'}}</td><td>{% if u.id!=current_user.id %}<form method="post" action="{{url_for('main.user_state',uid=u.id)}}"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><button class="button tiny" name="action" value="{{'disable' if u.active else 'enable'}}">{{'Disable' if u.active else 'Enable'}}</button></form>{% endif %}</td></tr>{% endfor %}</table></article><article class="panel"><h2>Create User</h2><form method="post"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><label>Name<input name="name" required></label><label>Email<input name="email" type="email" required></label><label>Role<select name="role"><option>fleet_viewer</option><option>control_room</option><option>fleet_manager</option><option>installer</option><option>fleet_admin</option></select></label><label>Temporary password<input name="temporary_password" type="password" required minlength="12"></label><button class="button primary">Create User</button></form></article></section>{% endblock %}
